<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1120 390 550" role="img" aria-label="SCR-006 稼働カレンダー SP 3/3" width="390" height="550"><title>SCR-006 稼働カレンダー SP 3/3</title><rect width="390" height="550" fill="white" y="1120" /><g font-family="Yu Gothic UI, Meiryo, Hiragino Sans, Noto Sans JP, Segoe UI, sans-serif" font-size="12" fill="#1F2937"><rect x="0" y="0" width="390" height="52" rx="4" fill="#E5E7EB" stroke="#9CA3AF" /><text x="38" y="33" font-size="12">PMAI</text><rect x="275" y="9" width="103" height="34" rx="4" fill="#FFFFFF" stroke="#9CA3AF" /><text x="284" y="31" font-size="12">メニュー</text><text x="36" y="91" font-size="21">稼働カレンダー</text><rect x="31" y="111" width="344" height="154" rx="4" fill="#F3F4F6" stroke="#9CA3AF" /><text x="45" y="133" font-size="12">表示月</text><rect x="45" y="142" width="154" height="34" rx="4" fill="#FFFFFF" stroke="#9CA3AF" /><text x="54" y="164" font-size="12">2026年10月</text><rect x="210" y="142" width="65" height="34" rx="4" fill="#FFFFFF" stroke="#9CA3AF" /><text x="219" y="164" font-size="12">前月</text><rect x="284" y="142" width="74" height="34" rx="4" fill="#FFFFFF" stroke="#9CA3AF" /><text x="293" y="164" font-size="12">次月</text><text x="45" y="197" font-size="12">対象ライン</text><rect x="45" y="207" width="214" height="34" rx="4" fill="#FFFFFF" stroke="#9CA3AF" /><text x="54" y="229" font-size="12">L-001 — 第1ライン</text><rect x="268" y="207" width="90" height="34" rx="4" fill="#FFFFFF" stroke="#9CA3AF" /><text x="277" y="229" font-size="12">表示更新</text><rect x="31" y="280" width="344" height="58" rx="4" fill="#F3F4F6" stroke="#9CA3AF" /><text x="45" y="303" font-size="12">稼働 ／ 休み ／ 設定なし</text><text x="45" y="324" font-size="11">工場日付：2026-10-01（Asia/Tokyo）</text><rect x="31" y="356" width="344" height="347" rx="4" fill="#FFFFFF" stroke="#9CA3AF" /><text x="45" y="382" font-size="12">2026年10月：日付一覧（抜粋）</text><rect x="45" y="401" width="315" height="47" rx="4" fill="#FFFFFF" stroke="#9CA3AF" /><text x="55" y="429" font-size="11">10/10（土）　休み：週間規則</text><rect x="45" y="455" width="315" height="47" rx="4" fill="#FFFFFF" stroke="#9CA3AF" /><text x="55" y="483" font-size="11">10/11（日）　休み：週間規則</text><rect x="45" y="509" width="315" height="47" rx="4" fill="#F3F4F6" stroke="#9CA3AF" /><text x="55" y="537" font-size="11">10/12（月）　稼働 4h：ライン例外</text><rect x="45" y="563" width="315" height="47" rx="4" fill="#FFFFFF" stroke="#9CA3AF" /><text x="55" y="591" font-size="11">10/13（火）　稼働 7.5h：週間規則</text><rect x="45" y="617" width="315" height="47" rx="4" fill="#FFFFFF" stroke="#9CA3AF" /><text x="55" y="645" font-size="11">10/14（水）　稼働 7.5h：週間規則</text><rect x="31" y="725" width="344" height="207" rx="4" fill="#F3F4F6" stroke="#9CA3AF" /><text x="45" y="750" font-size="12">選択日：2026-10-12</text><text x="45" y="777" font-size="12">稼働：4時間</text><text x="45" y="804" font-size="12">適用元：ライン日付例外</text><text x="45" y="831" font-size="12">ライン理由：臨時稼働</text><text x="45" y="858" font-size="12">下位：工場例外「保守休業」</text><text x="45" y="885" font-size="12">過去日は参照のみ</text><rect x="31" y="952" width="344" height="153" rx="4" fill="#F3F4F6" stroke="#9CA3AF" /><rect x="45" y="973" width="315" height="34" rx="4" fill="#FFFFFF" stroke="#9CA3AF" /><text x="54" y="995" font-size="12">週間規則を編集</text><rect x="45" y="1018" width="315" height="34" rx="4" fill="#FFFFFF" stroke="#9CA3AF" /><text x="54" y="1040" font-size="12">日付例外を編集</text><text x="45" y="1084" font-size="11">編集可否はサーバーの工場日付で判定</text><rect x="31" y="1125" width="344" height="205" rx="4" fill="#F3F4F6" stroke="#9CA3AF" /><g data-item="8"><rect x="5" y="1136" width="22" height="22" rx="7" fill="#C2410C" /><text x="16" y="1151" text-anchor="middle" fill="white" font-weight="bold">8</text></g><text x="45" y="1151" font-size="12">日別能力参照：選択ライン L-001</text><rect x="45" y="1168" width="315" height="34" rx="4" fill="#FFFFFF" stroke="#9CA3AF" /><text x="54" y="1190" font-size="12">製品：P-1001 — ブレーキキャリパー</text><rect x="45" y="1214" width="315" height="34" rx="4" fill="#FFFFFF" stroke="#9CA3AF" /><text x="54" y="1236" font-size="12">日付：2026-10-12</text><rect x="45" y="1260" width="315" height="34" rx="4" fill="#FFFFFF" stroke="#9CA3AF" /><text x="54" y="1282" font-size="12">能力を確認</text><rect x="31" y="1350" width="344" height="171" rx="4" fill="#F3F4F6" stroke="#9CA3AF" /><g data-item="9"><rect x="5" y="1361" width="22" height="22" rx="7" fill="#C2410C" /><text x="16" y="1376" text-anchor="middle" fill="white" font-weight="bold">9</text></g><text x="45" y="1387" font-size="21">参考能力：1,920 個</text><text x="45" y="1420" font-size="12">4時間 × 60 ÷ 0.125分／個</text><text x="45" y="1456" font-size="11">現在設定の参考値。予約・実績ではありません。</text><text x="45" y="1485" font-size="11">過去の日付には能力を表示しません。</text><text x="31" y="1561" font-size="11">別状態：週間／日付エディター、中央確認。</text><text x="31" y="1585" font-size="11">読込・空・エラー・競合・結果不明は本文参照。</text><text x="31" y="1609" font-size="11">配置例です。実装・稼働の証拠ではありません。</text></g></svg>