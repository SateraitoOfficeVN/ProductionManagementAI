<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">SCR-004 PC grey-box wireframe</title><desc id="desc">Shared header, catalog search and table, pagination, product form mode, and retire confirmation.</desc>
