<svg xmlns="http://www.w3.org/2000/svg" width="440" height="780" viewBox="0 0 440 780" role="img" aria-labelledby="title desc">
  <title id="title">SCR-004 SP wireframe with product type</title><desc id="desc">Stacked filters with a type select, product cards showing the type, and a one-column form with a required type select. New items are numbered 8 to 10.</desc>
  <style>text{font:17px sans-serif;fill:#333}.small{font-size:14px}.box{fill:#f1f1f1;stroke:#888;stroke-width:2}.new{fill:#fff;stroke:#333;stroke-width:3;stroke-dasharray:6 4}.call{fill:#fff;stroke:#333;stroke-width:2}.num{font:bold 16px sans-serif;text-anchor:middle}</style>
  <rect x="14" y="15" width="412" height="66" class="box"/><text x="50" y="55">ProductionManagementAI　 メニュー</text><circle cx="28" cy="23" r="14" class="call"/><text x="28" y="29" class="num">1</text>
  <rect x="14" y="94" width="412" height="70" class="box"/><text x="50" y="136">製品マスタ　　［製品を登録］</text><circle cx="28" cy="102" r="14" class="call"/><text x="28" y="108" class="num">2</text>
  <rect x="14" y="177" width="412" height="190" class="box"/><text x="50" y="215" class="small">製品コード・製品名で検索</text><text x="50" y="251" class="small">状態：すべて</text><rect x="44" y="266" width="360" height="38" class="new"/><text x="56" y="291" class="small">種別：すべて ▾</text><text x="50" y="343" class="small">［検索］　［クリア］</text><circle cx="28" cy="185" r="14" class="call"/><text x="28" y="191" class="num">3</text><circle cx="44" cy="266" r="14" class="call"/><text x="44" y="272" class="num">8</text>
  <rect x="14" y="381" width="412" height="170" class="box"/><text x="50" y="423">P-1001　ブレーキキャリパー</text><rect x="44" y="437" width="130" height="32" class="new"/><text x="54" y="459" class="small">種別：完成品</text><text x="185" y="459" class="small">単位：個　使用中</text><text x="50" y="510" class="small">［編集］　［使用停止］</text><circle cx="28" cy="389" r="14" class="call"/><text x="28" y="395" class="num">4</text><circle cx="44" cy="437" r="14" class="call"/><text x="44" y="443" class="num">9</text>
  <rect x="14" y="565" width="412" height="62" class="box"/><text x="50" y="602" class="small">30件　 前へ　 1 / 2　 次へ</text><circle cx="28" cy="573" r="14" class="call"/><text x="28" y="579" class="num">5</text>
  <rect x="14" y="641" width="412" height="124" class="box"/><text x="50" y="678" class="small">フォーム（1列）：製品コード / 製品名</text><rect x="44" y="692" width="200" height="34" class="new"/><text x="54" y="715" class="small">種別［必須］▾</text><text x="50" y="752" class="small">単位 / 図面番号　 保存 / キャンセル</text><circle cx="28" cy="649" r="14" class="call"/><text x="28" y="655" class="num">6</text><circle cx="44" cy="692" r="14" class="call"/><text x="44" y="698" class="num">10</text>
</svg>
