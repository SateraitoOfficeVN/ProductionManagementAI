  <rect class="box" x="14" y="403" width="412" height="91"/><text class="small" x="48" y="439">エラー：数量と単位を確認してください。</text><text class="small" x="48" y="470">入力値は保持されます。</text><circle class="call" cx="28" cy="413" r="14"/><text class="num" x="28" y="419">4</text>
</svg>
