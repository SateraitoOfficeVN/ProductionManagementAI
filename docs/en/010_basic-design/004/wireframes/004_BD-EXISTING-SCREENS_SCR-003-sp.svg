<svg xmlns="http://www.w3.org/2000/svg" width="440" height="800" viewBox="0 0 440 800" role="img" aria-labelledby="title desc">
  <title id="title">SCR-003 SP impact wireframe</title><desc id="desc">Stacked count tiles, attention cards with units, count chart and top products by order count.</desc>
  <style>text{font:16px 'Yu Gothic UI',Meiryo,sans-serif;fill:#333}.small{font-size:13px}.box{fill:#f1f1f1;stroke:#888;stroke-width:2}.call{fill:#fff;stroke:#333;stroke-width:2}.num{font:bold 15px sans-serif;text-anchor:middle}</style>
  <rect class="box" x="14" y="14" width="412" height="116"/><text x="48" y="52">納品実績</text><text class="small" x="48" y="82">今週の完了 18件　今月の完了 62件</text><text class="small" x="48" y="109">単位混在の数量合計なし</text><circle class="call" cx="28" cy="24" r="14"/><text class="num" x="28" y="30">8</text>
