  <rect class="box" x="14" y="530" width="412" height="240"/><text x="48" y="568">未完了製造指示の多い製品</text><text class="small" x="48" y="611">1. P-1001　5件　24 個</text><text class="small" x="48" y="650">2. P-1002　4件　18 枚</text><text class="small" x="48" y="689">3. P-2001　3件　6.375 kg</text><circle class="call" cx="28" cy="540" r="14"/><text class="num" x="28" y="546">11</text>
