<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">SCR-004 PC wireframe with product type</title><desc id="desc">Product master list with a type filter, a type column and a required type select on the form. New items are numbered 8 to 10.</desc>
  <style>text{font:19px sans-serif;fill:#333}.small{font-size:15px}.box{fill:#f1f1f1;stroke:#888;stroke-width:2}.new{fill:#fff;stroke:#333;stroke-width:3;stroke-dasharray:6 4}.call{fill:#fff;stroke:#333;stroke-width:2}.num{font:bold 18px sans-serif;text-anchor:middle}</style>
