  <text x="288" y="96" font-size="16" font-weight="700" fill="#374151" text-anchor="start">変更を破棄しますか？</text>
  <text x="288" y="130" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">この製造指示の変更は保存されていません。</text>
  <rect x="437.0" y="195" width="22" height="18" rx="9" fill="#C2410C"/>
  <text x="448" y="208" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">19</text>
  <rect x="464" y="189" width="118" height="30" rx="4" fill="#fff" stroke="#9CA3AF" stroke-width="1"/>
  <text x="523.0" y="208.0" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">編集を続ける</text>
  <rect x="587.0" y="195" width="22" height="18" rx="9" fill="#C2410C"/>
  <text x="598" y="208" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">18</text>
  <rect x="614" y="189" width="80" height="30" rx="4" fill="#4B5563" stroke="#4B5563" stroke-width="1"/>
  <text x="654.0" y="208.0" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">破棄</text>
  <text x="250" y="266" font-size="11" font-weight="400" fill="#fff" text-anchor="start" font-style="italic">Focus starts on 編集を続ける (Keep editing); Escape closes the dialog and returns focus to キャンセル (Cancel).</text>
