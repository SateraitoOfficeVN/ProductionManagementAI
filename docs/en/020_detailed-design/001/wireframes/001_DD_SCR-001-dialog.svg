<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="Yu Gothic UI, Meiryo, Hiragino Sans, Noto Sans JP, Segoe UI, sans-serif" role="img" aria-label="001_DD SCR-001 — discard-changes dialog (items 17–19)">
  <title>001_DD SCR-001 — discard-changes dialog (items 17–19)</title>
  <rect x="0.5" y="0.5" width="959" height="299" rx="8" fill="#fff" stroke="#9CA3AF"/>
  <rect x="1" y="1" width="958" height="298" rx="7" fill="#9CA3AF" stroke="#9CA3AF" stroke-width="1"/>
  <text x="20" y="26" font-size="11" font-weight="400" fill="#fff" text-anchor="start" font-style="italic">Page dimmed behind the dialog</text>
  <rect x="250" y="60" width="460" height="180" rx="6" fill="#fff" stroke="#9CA3AF" stroke-width="1"/>
  <rect x="259.0" y="81" width="22" height="18" rx="9" fill="#C2410C"/>
