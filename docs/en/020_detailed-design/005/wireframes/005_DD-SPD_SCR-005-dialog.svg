<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" role="img" aria-labelledby="title desc"><title id="title">SCR-005 dialog</title><desc id="desc">生産ライン・工程の詳細配置。番号はBD領域に対応。</desc><style>text{font-family:Yu Gothic UI,Meiryo,sans-serif;fill:#111827;font-size:15px}.label{font-weight:700}.badge{fill:#fff;font-size:13px;font-weight:700}</style><rect width="100%" height="100%" fill="#f9fafb"/><rect x="0" y="0" width="640" height="410" rx="6" fill="#d1d5db" stroke="#9ca3af"/><rect x="80" y="93" width="480" height="224" rx="6" fill="#fff" stroke="#9ca3af"/><circle data-region="9" cx="104" cy="119" r="12" fill="#111827"/><text class="badge" x="104" y="123" text-anchor="middle">9</text><text x="125" y="125" class="label">このラインを使用停止にしますか？</text><text x="108" y="173">L-001 ／ 組立ライン A</text><text x="108" y="205">過去の製造指示は保持されます。</text><rect x="108" y="243" width="160" height="48" rx="6" fill="#fff" stroke="#9ca3af"/><text x="124" y="273">キャンセル</text><rect x="290" y="243" width="150" height="48" rx="6" fill="#fee2e2" stroke="#9ca3af"/><text x="306" y="273">使用停止</text></svg>