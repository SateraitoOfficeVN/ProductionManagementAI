<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">SCR-005 生産ライン・工程 — 再設計 ダイアログ（領域 12）</title><desc id="desc">製品を追加、ラインの使用停止、製品の使用停止、変更の破棄。画面中央に表示し、最初のフォーカスは安全な操作。</desc>
<style>text{font-family:Meiryo,"Yu Gothic UI",sans-serif;fill:#172334}.s{font-size:12px}.h{font-size:15px;font-weight:700}.c{font-size:11px;fill:#536475}.dlg{fill:#fff;stroke:#9ca3af}.pri{fill:#1f5fa8}.sec{fill:#fff;stroke:#1f5fa8}.foc{fill:#fff;stroke:#111827;stroke-width:2.5}.dan{fill:#a33232}.in{fill:#fff;stroke:#8ea0b5}.b{fill:#1f5fa8}.bt{font-size:11px;fill:#fff;font-weight:700}.w{fill:#fff;font-size:12px;font-weight:700}.bl{fill:#1f5fa8;font-size:12px;font-weight:700}.opt{fill:#fff;stroke:#d5dde6}.sel{fill:#e8f0fb;stroke:#1f5fa8}</style>
<rect width="1200" height="560" fill="#9aa1ab"/>
<g><rect x="20" y="20" width="460" height="520" rx="8" class="dlg"/><circle cx="40" cy="40" r="10" class="b"/><text x="40" y="44" text-anchor="middle" class="bt">12</text><text x="58" y="46" class="h">製品を追加</text>
<text x="40" y="76" class="s">製品を検索</text><rect x="40" y="82" width="320" height="34" rx="4" class="foc"/><rect x="368" y="82" width="92" height="34" rx="4" class="pri"/><text x="414" y="104" text-anchor="middle" class="w">検索</text><text x="40" y="136" class="s">45 件（1 ページ 20 件）</text><rect x="462" y="150" width="5" height="60" rx="2" fill="#9aa5b4"/>
<rect x="40" y="146" width="420" height="56" rx="4" class="sel"/><circle cx="58" cy="174" r="7" fill="#fff" stroke="#1f5fa8"/><circle cx="58" cy="174" r="4" fill="#1f5fa8"/><text x="74" y="170" class="s" font-weight="700">P-1004　ドライブシャフト</text><text x="74" y="190" class="c">単位：本</text>
<rect x="40" y="208" width="420" height="56" rx="4" class="opt"/><circle cx="58" cy="236" r="7" fill="#fff" stroke="#8ea0b5"/><text x="74" y="232" class="s" font-weight="700">P-1005　等速ジョイント</text><text x="74" y="252" class="c">単位：個</text>
<rect x="40" y="270" width="420" height="56" rx="4" class="opt"/><circle cx="58" cy="298" r="7" fill="#fff" stroke="#8ea0b5"/><text x="74" y="294" class="s" font-weight="700">P-1020　ECU ケース</text><text x="74" y="314" class="c">単位：kg</text>
<text x="40" y="350" class="c">候補は枠内でスクロール。2 ページ以上の場合のみ「前へ　1 / 3　次へ」を表示。</text>
<text x="40" y="380" class="s">追加すると、表示されている単位で 1 単位あたりの</text><text x="40" y="398" class="s">製造時間を登録します。</text>
<rect x="40" y="420" width="64" height="34" rx="4" class="pri"/><text x="72" y="442" text-anchor="middle" class="w">追加</text><rect x="112" y="420" width="88" height="34" rx="4" class="sec"/><text x="156" y="442" text-anchor="middle" class="bl">キャンセル</text>
<text x="40" y="484" class="c">最初のフォーカス：検索欄。Esc／キャンセルは変更なし。</text><text x="40" y="502" class="c">追加後は追加した行の製造時間入力へフォーカス。</text></g>
<g><rect x="500" y="20" width="330" height="170" rx="8" class="dlg"/><text x="520" y="50" class="h">このラインを使用停止にしますか？</text><text x="520" y="76" class="s">L-001 ／ 組立ライン A</text><text x="520" y="96" class="s">過去の製造指示は保持されます。使用停止後は</text><text x="520" y="114" class="s">新しい製造指示で選択できません。</text><rect x="520" y="132" width="88" height="34" rx="4" class="foc"/><text x="564" y="154" text-anchor="middle" class="bl">キャンセル</text><rect x="616" y="132" width="80" height="34" rx="4" class="dan"/><text x="656" y="154" text-anchor="middle" class="w">使用停止</text></g>
<g><rect x="850" y="20" width="330" height="170" rx="8" class="dlg"/><text x="870" y="50" class="h">この製品を使用停止にしますか？</text><text x="870" y="76" class="s">P-1001 ／ ブレーキキャリパー</text><text x="870" y="96" class="s">保存すると、このラインでこの製品を新しく</text><text x="870" y="114" class="s">選択できなくなります。</text><rect x="870" y="132" width="88" height="34" rx="4" class="foc"/><text x="914" y="154" text-anchor="middle" class="bl">キャンセル</text><rect x="966" y="132" width="80" height="34" rx="4" class="dan"/><text x="1006" y="154" text-anchor="middle" class="w">使用停止</text></g>
<g><rect x="500" y="210" width="330" height="150" rx="8" class="dlg"/><text x="520" y="240" class="h">変更を破棄しますか？</text><text x="520" y="266" class="s">保存していない変更は失われます。</text><rect x="520" y="290" width="104" height="34" rx="4" class="foc"/><text x="572" y="312" text-anchor="middle" class="bl">編集を続ける</text><rect x="632" y="290" width="92" height="34" rx="4" class="dan"/><text x="678" y="312" text-anchor="middle" class="w">変更を破棄</text></g>
<g><rect x="850" y="210" width="330" height="150" rx="8" fill="#f9fafb" stroke="#c3ccd7" stroke-dasharray="4 3"/><text x="870" y="238" class="s" font-weight="700">共通</text><text x="870" y="262" class="c">画面中央・幅 min(480px, 100vw − 32px)</text><text x="870" y="282" class="c">（製品を追加は最大 640px）。</text><text x="870" y="302" class="c">太枠は最初のフォーカス。背景は操作不可。</text><text x="870" y="322" class="c">閉じると開いたボタンへフォーカスを戻す。</text></g>
</svg>
