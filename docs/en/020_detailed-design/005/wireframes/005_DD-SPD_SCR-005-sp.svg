<svg xmlns="http://www.w3.org/2000/svg" width="820" height="690" viewBox="0 0 820 690" role="img" aria-labelledby="title desc"><title id="title">SCR-005 モバイル一覧・編集</title><desc id="desc">モバイル一覧と編集の2画面。番号はBD領域に対応。</desc><style>text{font-family:Yu Gothic UI,Meiryo,sans-serif;fill:#111827;font-size:15px}.label{font-weight:700}.badge{fill:#fff;font-size:13px;font-weight:700}</style><rect x="0" y="25" width="390" height="650" fill="#f9fafb" /><text x="16" y="19" class="label">一覧</text><rect x="420" y="25" width="390" height="650" fill="#f9fafb" /><text x="436" y="19" class="label">編集</text><g transform="translate(0 30)"><rect x="12" y="12" width="366" height="60" rx="6" fill="#fff" stroke="#9ca3af" /><circle data-region="1" cx="32" cy="42" r="12" fill="#111827" /><text class="badge" x="32" y="46" text-anchor="middle">1</text><text x="54" y="48">PMAI</text><text x="240" y="48">メニュー</text><circle data-region="2" cx="32" cy="104" r="12" fill="#111827" /><text class="badge" x="32" y="108" text-anchor="middle">2</text><text x="54" y="110" class="label">生産ライン・工程</text><rect x="12" y="130" width="366" height="180" rx="6" fill="#fff" stroke="#9ca3af" /><circle data-region="3" cx="32" cy="155" r="12" fill="#111827" /><text class="badge" x="32" y="159" text-anchor="middle">3</text><text x="54" y="160">コード・名称で検索</text><rect x="28" y="177" width="334" height="44" rx="6" fill="#fff" stroke="#9ca3af" /><text x="40" y="204">L-001</text><text x="28" y="252">状態：すべて　検索　クリア</text><rect x="12" y="328" width="366" height="150" rx="6" fill="#fff" stroke="#9ca3af" /><circle data-region="4" cx="32" cy="353" r="12" fill="#111827" /><text class="badge" x="32" y="357" text-anchor="middle">4</text><text x="54" y="358" class="label">L-001　組立ライン A</text><text x="28" y="390">8 時間／日　使用中</text><text x="28" y="438">編集　　使用停止</text><circle data-region="5" cx="32" cy="508" r="12" fill="#111827" /><text class="badge" x="32" y="512" text-anchor="middle">5</text><text x="54" y="514">1 件　　前へ　1 / 1　次へ</text><text x="270" y="110">新規ライン</text></g><g transform="translate(420 -510)"><circle data-region="2" cx="32" cy="558" r="12" fill="#111827" /><text class="badge" x="32" y="562" text-anchor="middle">2</text><text x="54" y="564" class="label">生産ライン編集</text><rect x="12" y="584" width="366" height="185" rx="6" fill="#fff" stroke="#9ca3af" /><circle data-region="6" cx="32" cy="609" r="12" fill="#111827" /><text class="badge" x="32" y="613" text-anchor="middle">6</text><text x="54" y="614">ラインコード：L-001（変更不可）</text><text x="28" y="649">ライン名：組立ライン A</text><text x="28" y="684">稼働時間／日：8 時間</text><text x="28" y="729">保存　　キャンセル</text><rect x="12" y="787" width="366" height="180" rx="6" fill="#fff" stroke="#9ca3af" /><circle data-region="7" cx="32" cy="811" r="12" fill="#111827" /><text class="badge" x="32" y="815" text-anchor="middle">7</text><text x="54" y="817" class="label">生産可能な製品　＋製品を追加</text><text x="28" y="855">P-1001　ブレーキキャリパー</text><text x="28" y="890">製造時間／単位：2.5 分／個</text><text x="28" y="930">使用停止予定（保存後に反映）</text><rect x="12" y="985" width="366" height="108" rx="6" fill="#fffbeb" stroke="#9ca3af" /><circle data-region="8" cx="32" cy="1009" r="12" fill="#111827" /><text class="badge" x="32" y="1013" text-anchor="middle">8</text><text x="54" y="1015" class="label">単位の再確認が必要です。</text><text x="28" y="1049">確認済み：個　現在：kg</text><text x="28" y="1077">現在の単位で確認</text></g></svg>