<g><rect x="20" y="92" width="540" height="62" class="reg"/><circle cx="34" cy="108" r="10" class="b"/><text x="34" y="112" text-anchor="middle" class="bt">2</text><text x="52" y="116" class="h">生産ライン・工程</text><text x="52" y="138" class="c">生産ラインと、製品ごとの製造時間を管理します。</text><rect x="460" y="104" width="88" height="34" rx="4" class="pri"/><text x="504" y="126" text-anchor="middle" class="w">新規ライン</text></g>
<g><rect x="20" y="162" width="540" height="80" class="reg"/><circle cx="34" cy="178" r="10" class="b"/><text x="34" y="182" text-anchor="middle" class="bt">3</text><text x="52" y="184" class="s">コード・名称で検索</text><rect x="52" y="192" width="230" height="34" rx="4" class="in"/><text x="296" y="184" class="s">状態</text><rect x="296" y="192" width="110" height="34" rx="4" class="in"/><text x="306" y="214" class="s">すべて ▾</text><rect x="414" y="192" width="62" height="34" rx="4" class="pri"/><text x="445" y="214" text-anchor="middle" class="w">検索</text><rect x="484" y="192" width="64" height="34" rx="4" class="sec"/><text x="516" y="214" text-anchor="middle" class="bl">クリア</text></g>
