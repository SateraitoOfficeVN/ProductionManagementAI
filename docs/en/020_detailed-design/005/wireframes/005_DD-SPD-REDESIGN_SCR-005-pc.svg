<text x="60" y="484" class="c">名前が長い場合はライン名の列だけ折り返します。状態・操作は折り返しません。</text><text x="60" y="502" class="c">表は最大高さの枠内でスクロール（見出しは固定）。</text><rect x="542" y="358" width="5" height="60" rx="2" fill="#9aa5b4"/></g>
