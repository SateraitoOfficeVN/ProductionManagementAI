<text x="24" y="590" class="c">4：表示件数 10／20／50／100（初期値 20）。6：2 ページ以上の場合のみ表示。</text>
<text x="24" y="610" class="c">4：0 件時は「生産ラインはまだ登録されていません。」と</text>
<text x="24" y="628" class="c">　　「該当する生産ラインはありません。」を区別します。</text>
