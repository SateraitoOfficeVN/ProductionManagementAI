<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">Product master detailed PC wireframe</title><desc id="desc">Numbered regions for list and form states, save/cancel, retirement dialog, and notices.</desc>
  <style>text{font:18px sans-serif;fill:#333}.small{font-size:15px}.box{fill:#f3f3f3;stroke:#777;stroke-width:2}.call{fill:#fff;stroke:#333;stroke-width:2}.num{font:bold 17px sans-serif;text-anchor:middle}</style>
  <rect x="20" y="20" width="1060" height="65" class="box"/><text x="60" y="60">D-1　共有ヘッダー　製品マスタ</text>
  <rect x="20" y="104" width="520" height="445" class="box"/><text x="55" y="144">D-2　一覧モード</text><text x="55" y="195" class="small">検索　状態　検索ボタン</text><line x1="45" x2="515" y1="218" y2="218" stroke="#777"/><text x="55" y="260" class="small">製品コード　製品名　単位　状態　操作</text><text x="55" y="309" class="small">P-1001　ブレーキキャリパー　個　使用中</text><text x="55" y="359" class="small">P-1002　ブレーキディスクローター　枚</text><text x="55" y="493" class="small">前へ　1 / 2　次へ</text>
  <rect x="560" y="104" width="520" height="445" class="box"/><text x="595" y="144">D-3　登録・編集モード</text><text x="595" y="196" class="small">製品コード　P-1001（変更不可）</text><text x="595" y="257" class="small">製品名　　　［ブレーキキャリパー］</text><text x="595" y="318" class="small">単位　　　　個（変更不可）</text><text x="595" y="346" class="small">製造指示で使用中のため単位を変更できません</text><text x="595" y="390" class="small">図面番号　　［　　　　　　　　］</text><text x="595" y="434" class="small">D-6　エラー要約・項目エラー</text><rect x="795" y="474" width="245" height="52" class="box"/><text x="808" y="508" class="small">D-4　保存　キャンセル</text>
  <rect x="20" y="570" width="520" height="125" class="box"/><text x="55" y="612">D-5　使用停止の確認</text><text x="55" y="654" class="small">製品名　キャンセル　使用停止</text>
  <rect x="560" y="570" width="520" height="125" class="box"/><text x="595" y="612">D-6　読み込み・成功・失敗の通知</text><text x="595" y="654" class="small">文字とアイコンで状態を伝える</text>
</svg>
