<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="960" height="200" font-family="Yu Gothic UI, Meiryo, Hiragino Sans, Noto Sans JP, Segoe UI, sans-serif" role="img" aria-label="002_DD SCR-002 — empty state (24) and no-match state (25)">
  <title>002_DD SCR-002 — empty state (24) and no-match state (25)</title>
  <rect x="0.5" y="0.5" width="959" height="199" rx="8" fill="#fff" stroke="#9CA3AF"/>
  <rect x="20" y="20" width="440" height="140" rx="4" fill="#fff" stroke="#9CA3AF" stroke-width="1"/>
  <rect x="29.0" y="33" width="22" height="18" rx="9" fill="#C2410C"/>
  <text x="40" y="46" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">24</text>
  <text x="56" y="46" font-size="12" font-weight="700" fill="#374151" text-anchor="start">Empty state — no orders at all</text>
  <text x="40" y="80" font-size="13" font-weight="400" fill="#374151" text-anchor="start">製造指示はまだありません。最初の1件を登録してください。</text>
  <rect x="40" y="100" width="160" height="30" rx="4" fill="#4B5563" stroke="#4B5563" stroke-width="1"/>
  <text x="120.0" y="119.0" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">+ 新規製造指示</text>
  <rect x="500" y="20" width="440" height="140" rx="4" fill="#fff" stroke="#9CA3AF" stroke-width="1"/>
  <rect x="509.0" y="33" width="22" height="18" rx="9" fill="#C2410C"/>
  <text x="520" y="46" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">25</text>
  <text x="536" y="46" font-size="12" font-weight="700" fill="#374151" text-anchor="start">No-match state — filters set, nothing matched</text>
  <text x="520" y="80" font-size="13" font-weight="400" fill="#374151" text-anchor="start">絞り込みに一致する製造指示はありません。</text>
  <text x="520" y="98" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">納期の範囲を広げるか、製品の絞り込みを外してください。</text>
  <rect x="520" y="110" width="140" height="30" rx="4" fill="#fff" stroke="#9CA3AF" stroke-width="1"/>
  <text x="590.0" y="129.0" font-size="12" font-weight="600" fill="#374151" text-anchor="middle">絞り込みをクリア</text>
  <text x="500" y="184" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">The filter panel above keeps its values.</text>
  <text x="20" y="184" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start" font-style="italic">Replaces items 14–23.</text>
</svg>
