<svg xmlns="http://www.w3.org/2000/svg" width="760" height="950" viewBox="0 0 760 950" role="img" aria-labelledby="title"><title id="title">SCR-006 稼働カレンダー — 処理領域 sp</title><rect width="100%" height="100%" fill="white"/><g font-family="Meiryo, sans-serif"><g data-item="1"><rect x="12" y="12" width="354" height="60" rx="7" fill="#f9fafb" stroke="#9ca3af"/><circle cx="31" cy="31" r="12" fill="#c2410c"/><text x="31" y="35" text-anchor="middle" font-size="11" fill="white">1</text><text x="24" y="59" font-size="13" fill="#111827">稼働カレンダー　メニュー</text></g><g data-item="2"><rect x="12" y="84" width="354" height="74" rx="7" fill="#f9fafb" stroke="#9ca3af"/><circle cx="31" cy="103" r="12" fill="#c2410c"/><text x="31" y="107" text-anchor="middle" font-size="11" fill="white">2</text><text x="24" y="131" font-size="13" fill="#111827">読込・エラー・参照結果</text></g><g data-item="3"><rect x="12" y="170" width="354" height="104" rx="7" fill="#f9fafb" stroke="#9ca3af"/><circle cx="31" cy="189" r="12" fill="#c2410c"/><text x="31" y="193" text-anchor="middle" font-size="11" fill="white">3</text><text x="24" y="217" font-size="13" fill="#111827">表示月　対象ライン</text><text x="24" y="239" font-size="13" fill="#111827">適用　前月／翌月</text></g><g data-item="4"><rect x="12" y="286" width="354" height="66" rx="7" fill="#f9fafb" stroke="#9ca3af"/><circle cx="31" cy="305" r="12" fill="#c2410c"/><text x="31" y="309" text-anchor="middle" font-size="11" fill="white">4</text><text x="24" y="333" font-size="13" fill="#111827">稼働　休業　未設定</text></g><g data-item="5"><rect x="12" y="364" width="354" height="132" rx="7" fill="#f9fafb" stroke="#9ca3af"/><circle cx="31" cy="383" r="12" fill="#c2410c"/><text x="31" y="387" text-anchor="middle" font-size="11" fill="white">5</text><text x="24" y="411" font-size="13" fill="#111827">10月12日（月）　稼働</text><text x="24" y="433" font-size="13" fill="#111827">ライン例外　4時間</text><text x="24" y="455" font-size="13" fill="#111827">10月17日（土）　休業</text></g><g data-item="6"><rect x="12" y="508" width="354" height="92" rx="7" fill="#f9fafb" stroke="#9ca3af"/><circle cx="31" cy="527" r="12" fill="#c2410c"/><text x="31" y="531" text-anchor="middle" font-size="11" fill="white">6</text><text x="24" y="555" font-size="13" fill="#111827">選択日　適用元・下位規則</text><text x="24" y="577" font-size="13" fill="#111827">理由はテキストとして表示</text></g><g data-item="7"><rect x="12" y="612" width="354" height="76" rx="7" fill="#f9fafb" stroke="#9ca3af"/><circle cx="31" cy="631" r="12" fill="#c2410c"/><text x="31" y="635" text-anchor="middle" font-size="11" fill="white">7</text><text x="24" y="659" font-size="13" fill="#111827">週間規則　日付例外　履歴</text></g><g data-item="8"><rect x="12" y="700" width="354" height="116" rx="7" fill="#f9fafb" stroke="#9ca3af"/><circle cx="31" cy="719" r="12" fill="#c2410c"/><text x="31" y="723" text-anchor="middle" font-size="11" fill="white">8</text><text x="24" y="747" font-size="13" fill="#111827">参考能力　ライン／製品／日付</text><text x="24" y="769" font-size="13" fill="#111827">確認</text></g><g data-item="9"><rect x="12" y="828" width="354" height="94" rx="7" fill="#f9fafb" stroke="#9ca3af"/><circle cx="31" cy="847" r="12" fill="#c2410c"/><text x="31" y="851" text-anchor="middle" font-size="11" fill="white">9</text><text x="24" y="875" font-size="13" fill="#111827">1,920 個　または表示不可</text></g><g data-item="10"><rect x="390" y="12" width="354" height="84" rx="7" fill="#f9fafb" stroke="#9ca3af"/><circle cx="409" cy="31" r="12" fill="#c2410c"/><text x="409" y="35" text-anchor="middle" font-size="11" fill="white">10</text><text x="402" y="59" font-size="13" fill="#111827">対象 L-001 ／ 2026-10-12</text></g><g data-item="11"><rect x="390" y="108" width="354" height="104" rx="7" fill="#f9fafb" stroke="#9ca3af"/><circle cx="409" cy="127" r="12" fill="#c2410c"/><text x="409" y="131" text-anchor="middle" font-size="11" fill="white">11</text><text x="402" y="155" font-size="13" fill="#111827">週間モード：有効開始日・曜日</text><text x="402" y="177" font-size="13" fill="#111827">月　火　水　木　金　土　日</text></g><g data-item="12"><rect x="390" y="224" width="354" height="110" rx="7" fill="#f9fafb" stroke="#9ca3af"/><circle cx="409" cy="243" r="12" fill="#c2410c"/><text x="409" y="247" text-anchor="middle" font-size="11" fill="white">12</text><text x="402" y="271" font-size="13" fill="#111827">日付モード：稼働／休業</text><text x="402" y="293" font-size="13" fill="#111827">ライン設定を使用　／　時間</text></g><g data-item="13"><rect x="390" y="346" width="354" height="80" rx="7" fill="#f9fafb" stroke="#9ca3af"/><circle cx="409" cy="365" r="12" fill="#c2410c"/><text x="409" y="369" text-anchor="middle" font-size="11" fill="white">13</text><text x="402" y="393" font-size="13" fill="#111827">理由（任意）</text></g><g data-item="14"><rect x="390" y="438" width="354" height="122" rx="7" fill="#f9fafb" stroke="#9ca3af"/><circle cx="409" cy="457" r="12" fill="#c2410c"/><text x="409" y="461" text-anchor="middle" font-size="11" fill="white">14</text><text x="402" y="485" font-size="13" fill="#111827">保存　キャンセル　削除</text><text x="402" y="507" font-size="13" fill="#111827">結果不明：現在の状態を確認</text><text x="402" y="529" font-size="13" fill="#111827">入力を破棄して現在の状態を使用</text></g><g data-item="15"><rect x="390" y="572" width="354" height="106" rx="7" fill="#f9fafb" stroke="#9ca3af"/><circle cx="409" cy="591" r="12" fill="#c2410c"/><text x="409" y="595" text-anchor="middle" font-size="11" fill="white">15</text><text x="402" y="619" font-size="13" fill="#111827">保持版・取消／削除の記録</text><text x="402" y="641" font-size="13" fill="#111827">参照範囲・前へ／次へ</text></g><g data-item="16"><rect x="390" y="690" width="354" height="232" rx="7" fill="#f9fafb" stroke="#9ca3af"/><circle cx="409" cy="709" r="12" fill="#c2410c"/><text x="409" y="713" text-anchor="middle" font-size="11" fill="white">16</text><text x="402" y="737" font-size="13" fill="#111827">日付例外を削除しますか？</text><text x="402" y="759" font-size="13" fill="#111827">対象 L-001 ／ 2026-10-12</text><text x="402" y="781" font-size="13" fill="#111827">下位の規則が適用されます。</text><text x="402" y="803" font-size="13" fill="#111827">記録は保持されます。</text><text x="402" y="825" font-size="13" fill="#111827">キャンセル［初期フォーカス］</text><text x="402" y="847" font-size="13" fill="#111827">削除する</text></g></g></svg>