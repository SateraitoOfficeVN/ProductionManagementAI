<script>
// Commands are written once and shared by every language.
const CMD = {
  toolEf: 'dotnet tool install --global dotnet-ef --version 10.0.12',
  verify: 'git --version\ndocker --version\ndotnet --version        # 10.x\ndotnet ef --version     # 10.0.12\nnode --version          # v24.x',
  clone: 'cd C:\\\ngit clone https://github.com/SateraitoOfficeVN/ProductionManagementAI.git\ncd ProductionManagementAI',
  env: 'Copy-Item deploy\\.env.example deploy\\.env\nnotepad deploy\\.env',
  envLines: 'POSTGRES_PASSWORD=<POSTGRES_PASSWORD>\nPMAI_APP_DB_PASSWORD=<PMAI_APP_DB_PASSWORD>\nSEED_ADMIN_PASSWORD=<SEED_ADMIN_PASSWORD, e.g. Admin#2026>',
  db: 'docker compose -f deploy/compose.yaml up -d --build db\ndocker compose -f deploy/compose.yaml ps',
  migrate: 'dotnet ef database update --project src/backend/ProductionManagementAI.Infrastructure --startup-project src/backend/ProductionManagementAI.Api --connection "Host=localhost;Port=5433;Database=production_management_ai;Username=postgres;Password=<POSTGRES_PASSWORD>"',
  up: 'docker compose -f deploy/compose.yaml up -d --build',
  macEnv: 'cp deploy/.env.example deploy/.env',
  macPath: 'export PATH="$PATH:$HOME/.dotnet/tools"',
  stop: 'docker compose -f deploy/compose.yaml down',
  start: 'docker compose -f deploy/compose.yaml up -d',
  reset: 'docker compose -f deploy/compose.yaml down -v',
  logs: 'docker compose -f deploy/compose.yaml logs -f backend',
  stopApp: 'docker compose -f deploy/compose.yaml stop backend frontend',
  devBack: '$env:SEED_ADMIN_PASSWORD = "<SEED_ADMIN_PASSWORD>"\n$env:PGPASSWORD = "<PMAI_APP_DB_PASSWORD>"\ndotnet run --project src/backend/ProductionManagementAI.Api',
  devFront: 'cd src/frontend\nnpm ci\nnpm run dev',
  testBack: 'dotnet test src/backend/ProductionManagementAI.slnx',
  testFront: 'cd src/frontend\nnpm ci\nnpm run lint\nnpm test\ncd ../..',
  testE2e: 'cd tests/e2e\nnpm ci\nnpx playwright install chromium\n$env:E2E_ADMIN_PASSWORD = "<SEED_ADMIN_PASSWORD>"\n$env:E2E_BASE_URL = "http://localhost:3000"\nnpx playwright test'
};

const T = {
en: {
  eyebrow: 'Runbook · new computer',
  title: 'Run ProductionManagementAI locally',
  lede: 'Every step to go from a computer with nothing installed to the running app in your browser. Written for Windows (PowerShell); step 7 lists what changes on macOS and Linux.',
  toc: 'Steps',
  copy: 'Copy', copied: 'Copied', selected: 'Selected',
  facts: [['Repository', 'github.com/SateraitoOfficeVN/ProductionManagementAI'], ['App in browser', 'http://localhost:3000'], ['Sign in as', 'admin'], ['Ports used', '3000 · 8081 · 5433']],
  sections: [
    { id: 'tools', n: '1', h: 'Install the tools', body: `
<div class="tbl"><table><thead><tr><th>Tool</th><th>Version</th><th>Needed for</th><th>Download</th></tr></thead><tbody>
<tr><td>Git</td><td>any recent</td><td>Getting the code — not needed if you receive it as a zip</td><td><a href="https://git-scm.com/downloads">git-scm.com</a></td></tr>
<tr><td>Docker Desktop</td><td>current</td><td>Database, backend and frontend containers</td><td><a href="https://www.docker.com/products/docker-desktop">docker.com</a></td></tr>
<tr><td>.NET SDK</td><td><strong>10.0.x</strong></td><td>Database migrations, and the backend in dev mode</td><td><a href="https://dotnet.microsoft.com/download/dotnet/10.0">dotnet.microsoft.com</a></td></tr>
<tr><td>Node.js</td><td><strong>24</strong></td><td>Only for dev mode and tests</td><td><a href="https://nodejs.org">nodejs.org</a></td></tr>
</tbody></table></div>
<p>On Windows, Docker Desktop needs WSL 2; its installer offers to turn it on, which may need a restart. After installing, <strong>start Docker Desktop</strong> and wait until it says it is running.</p>
<p>Open a <strong>new</strong> PowerShell window so it sees the new tools, then install the migration tool:</p>
{{toolEf}}
<p>Check everything is installed:</p>
{{verify}}` },
    { id: 'code', n: '2', h: 'Get the code', opt: 'optional', body: `
<p>Skip this step if you already have the code, for example as a zip file. Choose one of the two ways below.</p>
<h3>From a zip file</h3>
<ol>
<li>Unzip it to any folder, for example <code>C:\\ProductionManagementAI</code>.</li>
<li>Open that folder and check it directly contains <code>deploy</code>, <code>src</code> and <code>README.md</code>. If they sit one level deeper, use the inner folder.</li>
<li>If the zip already includes <code>deploy\\.env</code>, it holds the sender's passwords. Check its values in step 3 instead of creating a new file.</li>
</ol>
<h3>With Git</h3>
<p>The repository is public, so no GitHub account is needed.</p>
{{clone}}
<p>Either way, run every command after this from the <code>ProductionManagementAI</code> folder.</p>` },
    { id: 'env', n: '3', h: 'Create the settings file', body: `
{{env}}
<p>Change these three lines and save the file. Leave every other line as it is.</p>
{{envLines}}
<ul>
<li><code>POSTGRES_PASSWORD</code> is the database owner's password. You need it again in step 5.</li>
<li><code>PMAI_APP_DB_PASSWORD</code> is the password of the backend's database login. It has no default: the containers won't start if it is empty.</li>
<li><code>SEED_ADMIN_PASSWORD</code> is the password you sign in with as <code>admin</code>.</li>
</ul>
<div class="warn"><strong>Use a strong admin password.</strong> At least 6 characters with an uppercase letter, a lowercase letter, a digit and a symbol, for example <code>Admin#2026</code>. A weaker one, such as <code>admin</code>, makes the backend stop at startup.</div>
<p class="ok">Never commit <code>deploy/.env</code>; Git already ignores it.</p>` },
    { id: 'db', n: '4', h: 'Start the database', body: `
{{db}}
<p>The first run downloads images and can take a few minutes. The <code>db</code> service should show as running.</p>` },
    { id: 'migrate', n: '5', h: 'Create the tables and demo data', body: `
<p>Replace <code>&lt;POSTGRES_PASSWORD&gt;</code> with the value from step 3. Keep it on one line.</p>
{{migrate}}
<p>The first time, this also downloads the .NET packages and builds the backend. It ends with <code>Done.</code>, after loading 30 products and 124 demo orders.</p>` },
    { id: 'up', n: '6', h: 'Start the whole app', body: `
{{up}}
<p>Open <a href="http://localhost:3000">http://localhost:3000</a> and sign in with user name <code>admin</code> and your <code>SEED_ADMIN_PASSWORD</code>. You land on the dashboard; the menu leads to the order list and to a new order.</p>` },
    { id: 'mac', n: '7', h: 'On macOS or Linux', body: `
<p>The steps are the same, with three differences:</p>
<ul>
<li>On Linux, install Docker Engine with the Compose plugin instead of Docker Desktop.</li>
<li>In step 3, copy the file with the command below and open it in any text editor.</li>
<li>If <code>dotnet ef</code> is not found, add the .NET tools folder to your <code>PATH</code>.</li>
</ul>
{{macEnv}}
{{macPath}}` },
    { id: 'daily', h: 'Everyday use', body: `
<div class="tbl"><table><thead><tr><th>To</th><th>Run</th></tr></thead><tbody>
<tr><td>Stop the app (keeps data)</td><td><code>docker compose -f deploy/compose.yaml down</code></td></tr>
<tr><td>Start it again</td><td><code>docker compose -f deploy/compose.yaml up -d</code></td></tr>
<tr><td>Update after new code</td><td><code>git pull</code>, or unzip the new copy over the old folder keeping your <code>deploy\\.env</code>; then steps 5 and 6</td></tr>
<tr><td>Reset everything (deletes data)</td><td><code>docker compose -f deploy/compose.yaml down -v</code>, then steps 4–6</td></tr>
<tr><td>See backend logs</td><td><code>docker compose -f deploy/compose.yaml logs -f backend</code></td></tr>
</tbody></table></div>
<div class="warn"><strong>Changed a database password?</strong> The database reads <code>POSTGRES_PASSWORD</code> and <code>PMAI_APP_DB_PASSWORD</code> only when it is first created. After changing either one, reset everything.</div>` },
    { id: 'dev', h: 'Dev mode with live reload', opt: 'optional', body: `
<p>Needs Node.js 24. Do steps 1–5, then free the app ports:</p>
{{stopApp}}
<h3>Terminal 1 — backend (port 5033)</h3>
{{devBack}}
<h3>Terminal 2 — frontend</h3>
{{devFront}}
<p>Open the address Vite prints, normally <a href="http://localhost:5173">http://localhost:5173</a>. It forwards <code>/api</code> calls to the backend.</p>` },
    { id: 'tests', h: 'Run the tests', opt: 'optional', body: `
<h3>Backend</h3>
<p>Docker must be running; the tests start their own throwaway database and don't touch yours.</p>
{{testBack}}
<h3>Frontend</h3>
{{testFront}}
<h3>End-to-end, against the app from step 6</h3>
{{testE2e}}` },
    { id: 'help', h: 'If something goes wrong', body: `
<div class="tbl"><table><thead><tr><th>What you see</th><th>What to do</th></tr></thead><tbody>
<tr><td>Docker errors about the daemon or engine</td><td>Start Docker Desktop and wait until it is running.</td></tr>
<tr><td><code>dotnet ef</code> is not recognized</td><td>Open a new terminal; otherwise run the install command from step 1 again.</td></tr>
<tr><td><code>PMAI_APP_DB_PASSWORD must be set</code> or <code>SEED_ADMIN_PASSWORD must be set</code></td><td>Fill in those values in <code>deploy/.env</code> (step 3).</td></tr>
<tr><td>Backend stops with “Failed to seed admin user”</td><td>The admin password is too weak. Change <code>SEED_ADMIN_PASSWORD</code>, then run step 6 again.</td></tr>
<tr><td>Step 5 can't connect</td><td>Run step 4 first. The port is <strong>5433</strong>, and the password is your <code>POSTGRES_PASSWORD</code>.</td></tr>
<tr><td><code>password authentication failed for user "pmai_app"</code></td><td>A password changed after the first start. Reset everything (Everyday use).</td></tr>
<tr><td>The site opens but shows no data or errors</td><td>Step 5 was skipped. Run it, then step 6.</td></tr>
<tr><td>Port 3000, 5433 or 8081 already in use</td><td>Change <code>FRONTEND_PORT</code>, <code>POSTGRES_PORT</code> or <code>BACKEND_PORT</code> in <code>deploy/.env</code>. A new database port also goes into the step 5 command.</td></tr>
</tbody></table></div>` }
  ],
  footer: 'Based on the commands verified in the repository (ai/project.md, deploy/README.md) and its CI setup. Not yet run on a fresh machine.'
},
ja: {
  eyebrow: '手順書 · 新しいコンピューター',
  title: 'ProductionManagementAI をローカルで動かす',
  lede: '何もインストールされていないコンピューターから、ブラウザーでアプリが動くまでの全手順です。Windows（PowerShell）向けに書いています。macOS・Linux での違いは手順 7 にあります。',
  toc: '手順',
  copy: 'コピー', copied: 'コピーしました', selected: '選択しました',
  facts: [['リポジトリ', 'github.com/SateraitoOfficeVN/ProductionManagementAI'], ['ブラウザーで開く', 'http://localhost:3000'], ['サインイン', 'admin'], ['使用ポート', '3000 · 8081 · 5433']],
  sections: [
    { id: 'tools', n: '1', h: 'ツールをインストールする', body: `
<div class="tbl"><table><thead><tr><th>ツール</th><th>バージョン</th><th>用途</th><th>ダウンロード</th></tr></thead><tbody>
<tr><td>Git</td><td>最近のもの</td><td>コードの取得 — zip で受け取る場合は不要</td><td><a href="https://git-scm.com/downloads">git-scm.com</a></td></tr>
<tr><td>Docker Desktop</td><td>最新</td><td>データベース・バックエンド・フロントエンドのコンテナー</td><td><a href="https://www.docker.com/products/docker-desktop">docker.com</a></td></tr>
<tr><td>.NET SDK</td><td><strong>10.0.x</strong></td><td>データベースのマイグレーション、開発モードのバックエンド</td><td><a href="https://dotnet.microsoft.com/download/dotnet/10.0">dotnet.microsoft.com</a></td></tr>
<tr><td>Node.js</td><td><strong>24</strong></td><td>開発モードとテストのみ</td><td><a href="https://nodejs.org">nodejs.org</a></td></tr>
</tbody></table></div>
<p>Windows では Docker Desktop に WSL 2 が必要です。インストーラーが有効化を提案し、再起動が必要な場合があります。インストール後、<strong>Docker Desktop を起動</strong>し、実行中になるまで待ってください。</p>
<p>新しいツールを認識させるため<strong>新しい</strong> PowerShell ウィンドウを開き、マイグレーション用ツールをインストールします：</p>
{{toolEf}}
<p>すべてインストールされたか確認します：</p>
{{verify}}` },
    { id: 'code', n: '2', h: 'コードを取得する', opt: '任意', body: `
<p>zip ファイルなどで既にコードを持っている場合、この手順は不要です。次のどちらかの方法を選んでください。</p>
<h3>zip ファイルから</h3>
<ol>
<li>任意のフォルダーに展開します（例：<code>C:\\ProductionManagementAI</code>）。</li>
<li>そのフォルダーを開き、<code>deploy</code>・<code>src</code>・<code>README.md</code> が直下にあることを確認します。1 階層深い場合は、内側のフォルダーを使います。</li>
<li>zip に <code>deploy\\.env</code> が含まれている場合、送信者のパスワードが入っています。新しく作らずに、手順 3 でその値を確認してください。</li>
</ol>
<h3>Git で</h3>
<p>リポジトリは公開されているので、GitHub アカウントは不要です。</p>
{{clone}}
<p>どちらの場合も、以降のコマンドはすべて <code>ProductionManagementAI</code> フォルダーで実行します。</p>` },
    { id: 'env', n: '3', h: '設定ファイルを作成する', body: `
{{env}}
<p>次の 3 行を変更して保存します。その他の行はそのままにしてください。</p>
{{envLines}}

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const codeBlock = key => {
  const html = esc(CMD[key]).replace(/(#[^\n]*)$/gm, m => /^#\s/.test(m) || /#\s\d/.test(m) ? '<span class="c">' + m + '</span>' : m);
  return '<div class="cmd"><pre><code>' + html + '</code></pre><button type="button" data-copy="' + key + '"></button></div>';
};

let current = 'en';
function render(lang) {
  const t = T[lang];
  current = lang;
  document.documentElement.lang = lang === 'vi' ? 'vi' : lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n]; });
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  document.getElementById('facts').innerHTML = t.facts.map(([k, v]) => '<div class="fact"><dt>' + k + '</dt><dd>' + v + '</dd></div>').join('');
  document.getElementById('toc').innerHTML = t.sections.map(s => '<li><a href="#' + s.id + '"><span class="n">' + (s.n || '·') + '</span><span>' + s.h + '</span></a></li>').join('');
  document.getElementById('content').innerHTML = t.sections.map(s =>
    '<section id="' + s.id + '"><h2>' + (s.n ? '<span class="n">' + s.n + '</span>' : '') + '<span>' + s.h + '</span>' + (s.opt ? '<span class="opt">' + s.opt + '</span>' : '') + '</h2>' +
    s.body.replace(/\{\{(\w+)\}\}/g, (_, k) => codeBlock(k)) + '</section>'
  ).join('') + '<footer>' + t.footer + '</footer>';
  document.querySelectorAll('[data-copy]').forEach(b => { b.textContent = t.copy; });
  document.title = t.title;
  try { localStorage.setItem('pmai-setup-lang', lang); } catch (e) {}
}

document.querySelector('.langs').addEventListener('click', e => {
  const b = e.target.closest('button[data-lang]');
  if (b) render(b.dataset.lang);
});

document.getElementById('content').addEventListener('click', e => {
  const b = e.target.closest('button[data-copy]');
  if (!b) return;
  const t = T[current];
  const text = CMD[b.dataset.copy];
  const flash = label => { b.textContent = label; b.classList.add('done'); setTimeout(() => { b.textContent = t.copy; b.classList.remove('done'); }, 1600); };
  const selectIt = () => {
    const range = document.createRange();
    range.selectNodeContents(b.parentElement.querySelector('code'));
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) {}
    flash(ok ? t.copied : t.selected);
  };
  try {
    if (!navigator.clipboard) { selectIt(); return; }
    navigator.clipboard.writeText(text).then(() => flash(t.copied), selectIt);
  } catch (err) { selectIt(); }
});

let start = 'en';
const fromHash = (location.hash || '').slice(1);
