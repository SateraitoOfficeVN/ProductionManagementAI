services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-production_management_ai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      # Restricted runtime login for the backend (DEC-016); created by db/init/10-app-login.sh on a fresh volume.
      PMAI_APP_DB_PASSWORD: ${PMAI_APP_DB_PASSWORD:?PMAI_APP_DB_PASSWORD must be set}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # Runtime login only (least privilege, DEC-016). Migrations run separately as the owner — see deploy/README.md.
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-production_management_ai};Username=pmai_app;Password=${PMAI_APP_DB_PASSWORD:?PMAI_APP_DB_PASSWORD must be set}
      Plant__TimeZone: ${PLANT_TIMEZONE:-Asia/Tokyo}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be set}
      DATA_PROTECTION_KEYS_PATH: /keys
    volumes:
      - dp-keys:/keys
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8081}:8080"

  frontend:
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  db-data:
  dp-keys:
