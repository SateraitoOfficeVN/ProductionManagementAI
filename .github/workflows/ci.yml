name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/backend/ProductionManagementAI.slnx

      - name: Build
        run: dotnet build src/backend/ProductionManagementAI.slnx --no-restore --configuration Release

      # Includes the integration test project (Testcontainers.PostgreSql); GitHub-hosted
      # ubuntu-latest runners have Docker preinstalled and running, so no extra setup is needed.
      - name: Test
        run: dotnet test src/backend/ProductionManagementAI.slnx --no-build --configuration Release

  frontend:
    name: Frontend (build, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
