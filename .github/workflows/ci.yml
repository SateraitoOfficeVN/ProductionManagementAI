name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/backend/ProductionManagementAI.slnx

      - name: Build
        run: dotnet build src/backend/ProductionManagementAI.slnx --no-restore --configuration Release

      # Includes the integration test project (Testcontainers.PostgreSql); GitHub-hosted
      # ubuntu-latest runners have Docker preinstalled and running, so no extra setup is needed.
      - name: Test
        run: dotnet test src/backend/ProductionManagementAI.slnx --no-build --configuration Release

  frontend:
    name: Frontend (build, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Browser journeys against the real Docker Compose stack (WI-002 DEC-025). Every credential is a throwaway
  # value generated for this run and masked in the log; nothing is read from repository secrets.
  e2e:
    name: E2E (Compose stack + Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Create throwaway deploy/.env
        run: |
          owner="$(openssl rand -hex 16)"
          app="$(openssl rand -hex 16)"
          admin="Ci-9$(openssl rand -hex 12)!"
          echo "::add-mask::$owner"
          echo "::add-mask::$app"
          echo "::add-mask::$admin"
          {
            echo "POSTGRES_DB=production_management_ai"
            echo "POSTGRES_USER=postgres"
            echo "POSTGRES_PASSWORD=$owner"
            echo "PMAI_APP_DB_PASSWORD=$app"
            echo "PLANT_TIMEZONE=Asia/Tokyo"
            echo "SEED_ADMIN_PASSWORD=$admin"
            echo "ASPNETCORE_ENVIRONMENT=Development"
            echo "BACKEND_PORT=8081"
            echo "FRONTEND_PORT=3000"
            echo "POSTGRES_PORT=5433"
          } > deploy/.env

      - name: Start the database
        run: docker compose -f deploy/compose.yaml up -d --build --wait db

      # Migrations run as the owner; the app itself connects as the restricted pmai_app login (DEC-016).
      - name: Apply migrations as the owner
        run: |
          # dotnet ef needs restored projects to read their metadata; a fresh checkout has none.
          dotnet restore src/backend/ProductionManagementAI.slnx
          dotnet tool install --global dotnet-ef --version 10.0.12
          set -a; . deploy/.env; set +a
          dotnet ef database update \
            --project src/backend/ProductionManagementAI.Infrastructure \
            --startup-project src/backend/ProductionManagementAI.Api \
            --connection "Host=localhost;Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"

      - name: Start the full stack
        run: |
          docker compose -f deploy/compose.yaml up -d --build
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8081/health >/dev/null && curl -fsS http://localhost:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Stack did not become ready in time" >&2
          exit 1

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: tests/e2e
        run: |
          set -a; . ../../deploy/.env; set +a
          E2E_ADMIN_PASSWORD="$SEED_ADMIN_PASSWORD" E2E_BASE_URL="http://localhost:${FRONTEND_PORT}" npx playwright test

      - name: Show stack logs
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color --tail=200

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose.yaml down -v
